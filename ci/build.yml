# Builds the mod on every push and pull request and keeps the jar as a download.
name: build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: |
          echo "mod=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Build and run checks
        run: |
          chmod +x ./gradlew
          ./gradlew build -PpublicBuild=true --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: foraging-planner-${{ steps.version.outputs.mod }}+${{ steps.version.outputs.mc }}-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 30
