# Checks the Modrinth setup without uploading anything: Actions > modrinth-check > Run workflow.
name: modrinth-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check token and project
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT || 'foraging-planner' }}
        run: |
          UA="debugsticq/foraging-planner (GitHub Actions check)"
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Secret MODRINTH_TOKEN is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Only scopes the release needs are used (no "Read user data"), so check with the project itself.
          CODE=$(curl -sS -o project.json -w "%{http_code}" -H "User-Agent: $UA" -H "Authorization: $MODRINTH_TOKEN" "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT")
          case "$CODE" in
            200) ;;
            401) echo "::error::Modrinth does not accept the token (invalid or expired). Create a new one with 'Create versions' and 'Read projects'."; exit 1 ;;
            404) echo "::error::Project '$MODRINTH_PROJECT' not found. Create it on Modrinth or set the MODRINTH_PROJECT variable to its slug. (Without 'Read projects' a draft is not found either.)"; exit 1 ;;
            *) echo "::error::Modrinth answered HTTP $CODE"; cat project.json; exit 1 ;;
          esac
          jq '{id, slug, title, status, loaders, game_versions}' project.json
          echo "Token and project OK. Everything is ready for release.bat."
