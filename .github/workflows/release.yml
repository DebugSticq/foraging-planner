# Push a tag like v1.0.3 (release.bat does that) and this builds the jar, creates a GitHub
# release with the matching part of CHANGELOG.md and, if a Modrinth token is set, uploads it there.
#
# Modrinth upload (optional):
#   Settings > Secrets and variables > Actions
#   - secret   MODRINTH_TOKEN    a Modrinth personal access token with "Create versions" and "Read projects"
#   - variable MODRINTH_PROJECT  the project slug or id (default: foraging-planner)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Check tag against gradle.properties
        id: version
        run: |
          MOD=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$MOD" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$MOD in gradle.properties"
            exit 1
          fi
          TYPE=release
          case "$MOD" in *alpha*) TYPE=alpha ;; *beta*|*rc*|*pre*) TYPE=beta ;; esac
          echo "mod=$MOD" >> "$GITHUB_OUTPUT"
          echo "mc=$MC" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build -PpublicBuild=true --console=plain

      - name: Changelog for this version
        run: |
          awk -v v="${{ steps.version.outputs.mod }}" '
            index($0, "## [" v "]") == 1 { take = 1; next }
            take && /^## \[/ { exit }
            take { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No section for ${{ steps.version.outputs.mod }} in CHANGELOG.md"
            echo "See CHANGELOG.md." > notes.md
          fi
          cat notes.md

      - name: Find jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$' | head -n 1)
          [ -n "$JAR" ] || { echo "::error::No jar built"; exit 1; }
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          [ "${{ steps.version.outputs.type }}" != "release" ] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" "${{ steps.jar.outputs.path }}" \
            --title "Foraging Planner ${{ steps.version.outputs.mod }} for ${{ steps.version.outputs.mc }}" \
            --notes-file notes.md $FLAGS

      - name: Modrinth upload
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT || 'foraging-planner' }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "No MODRINTH_TOKEN secret, skipping Modrinth."
            exit 0
          fi
          UA="debugsticq/foraging-planner (GitHub Actions)"
          # With the token, so a project that is still a draft or under review is found too.
          PROJECT_ID=$(curl -fsS -H "User-Agent: $UA" -H "Authorization: $MODRINTH_TOKEN" "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT" | jq -r .id)
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "::error::Modrinth project '$MODRINTH_PROJECT' not found. Check the MODRINTH_PROJECT variable and that the token has 'Read projects'."
            exit 1
          fi
          DATA=$(jq -n \
            --arg name "Foraging Planner ${{ steps.version.outputs.mod }}" \
            --arg number "${{ steps.version.outputs.mod }}+${{ steps.version.outputs.mc }}" \
            --arg mc "${{ steps.version.outputs.mc }}" \
            --arg type "${{ steps.version.outputs.type }}" \
            --arg project "$PROJECT_ID" \
            --rawfile changelog notes.md \
            '{name: $name, version_number: $number, changelog: $changelog,
              game_versions: [$mc], loaders: ["fabric"], version_type: $type,
              featured: true, status: "listed", project_id: $project,
              dependencies: [{project_id: "P7dR8mSH", dependency_type: "required"}],
              file_parts: ["file"], primary_file: "file"}')
          # --form-string sends the JSON as it is; with -F, curl would cut it at the first ";".
          CODE=$(curl -sS -o response.json -w "%{http_code}" -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: $UA" \
            --form-string "data=$DATA" \
            -F "file=@${{ steps.jar.outputs.path }};type=application/java-archive")
          if [ "$CODE" != "200" ]; then
            echo "::error::Modrinth answered HTTP $CODE"
            cat response.json
            exit 1
          fi
          jq '{id, version_number}' response.json
